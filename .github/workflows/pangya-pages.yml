name: Deploy PangYa S4 Calculator

on:
  push:
    branches:
      - pangya-s4-calculator
    paths:
      - 'pangya-s4-calculator/public/**'
      - '.github/workflows/pangya-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pangya-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pangya-s4-calculator/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
